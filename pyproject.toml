[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "construction_management_suite"
version = "2.0.0"
description = "Production-ready Construction Management Suite for ERPNext/Frappe"
authors = [{ name = "Your Company", email = "admin@construction.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "frappe",
    "erpnext",
]

[tool.setuptools.packages.find]
include = ["construction_management_suite*"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"
erpnext = ">=16.0.0-dev,<17.0.0"
